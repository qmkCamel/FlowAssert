<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc">
<title id="title">FlowAssert 当前架构</title><desc id="desc">可选 Viewer、MCP、DSH 入口复用 runtime 与 MirrorService 核心。工作台通过受限 facade 执行，Appium 控制设备，媒体回到 Viewer，证据保存到 Store。</desc>
