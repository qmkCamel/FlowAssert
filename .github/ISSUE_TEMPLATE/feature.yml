name: Feature request
description: Propose a focused improvement with compatibility and safety boundaries.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the observable behavior, alternatives and expected failure handling.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Compatibility and security boundaries
      description: Cover DSH/MCP reuse, loopback/media handling, session ownership, device mutations and supported platforms.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation path
      description: Explain how this can be tested deterministically with Mock/fakes and what maintainer-owned physical evidence is needed.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and OpenSpec changes.
          required: true
        - label: I did not include private device, account, signing or host information.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
