name: MirrorFixture
options:
  bundleIdPrefix: dev.mobilemirror
targets:
  MirrorFixture:
    type: application
    platform: iOS
    deploymentTarget: '16.0'
    sources: [MirrorFixture.swift]
    info:
      path: Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Connect to the local synthetic test server.
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mobilemirror.fixture
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_VERSION: '5.0'
